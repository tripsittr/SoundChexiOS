# The Xcode project is generated from this file with `xcodegen`, so the
# .xcodeproj is a build artifact rather than something hand-edited — the same
# approach the Tauri side uses, and it keeps merge conflicts out of the pbxproj.
#
# Regenerate after changing this file or adding source folders:
#   cd SoundChexiOS && xcodegen generate
name: SoundChex
options:
  bundleIdPrefix: app.soundchex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The signing team, kept here so `xcodegen generate` does not wipe it — the
    # generated .xcodeproj is a build artifact, so signing set in Xcode's UI does
    # not survive a regenerate. Same team the Tauri iOS build uses.
    DEVELOPMENT_TEAM: "7GSWB72PH6"
    CODE_SIGN_STYLE: Automatic
    # Versioning: SemVer with a music-themed name per minor release (see
    # Plans/Versioning.md). 0.2.0 is "Overture" — the first native release.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    # Strict concurrency is on by default at Swift 6; keep it, the app is small
    # enough to get right from the start.
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SoundChex:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.soundchex.ios
        # The home-screen name and the app icon (from Assets.xcassets).
        INFOPLIST_KEY_CFBundleDisplayName: SoundChex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Launch screen: a solid dark ground (base-900) so the first frame is the
        # app's own colour, not a white flash, before SwiftUI paints.
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: "SoundChexLaunch"
        # Dark only — the app commits to its dark theme.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # The app talks to a self-hosted server over Tailscale — often plain
        # http on a private address. ATS is relaxed for that; tighten later if
        # every deployment is https.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "YES"
        # Background audio, so playback continues when the screen locks.
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
