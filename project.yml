# The Xcode project is generated from this file with `xcodegen`, so the
# .xcodeproj is a build artifact rather than something hand-edited — the same
# approach the Tauri side uses, and it keeps merge conflicts out of the pbxproj.
#
# Regenerate after changing this file or adding source folders:
#   cd SoundChexiOS && xcodegen generate
name: SoundChex
options:
  bundleIdPrefix: app.soundchex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The signing team, kept here so `xcodegen generate` does not wipe it — the
    # generated .xcodeproj is a build artifact, so signing set in Xcode's UI does
    # not survive a regenerate. Same team the Tauri iOS build uses.
    DEVELOPMENT_TEAM: "7GSWB72PH6"
    CODE_SIGN_STYLE: Automatic
    # Versioning: SemVer with a music-themed name per minor release (see
    # Plans/Versioning.md). The name for each minor lives in
    # Sources/DesignSystem/AppRelease.swift — one written only in the
    # CHANGELOG is not shipped, because Settings reads that map.
    MARKETING_VERSION: "0.26.0"
    CURRENT_PROJECT_VERSION: "50"
    # Strict concurrency is on by default at Swift 6; keep it, the app is small
    # enough to get right from the start.
    SWIFT_STRICT_CONCURRENCY: complete

# An explicit, SHARED scheme. XcodeGen generates an implicit one that
# `xcodebuild` can find, but Xcode Cloud's workflow editor lists only schemes
# written to xcshareddata — with none there, the workflow has nothing to build
# and fails in a way that looks like the project is broken (S-406).
schemes:
  SoundChex:
    build:
      targets:
        SoundChex: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release

targets:
  SoundChex:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    # An explicit Info.plist (generated by XcodeGen with correct types) rather
    # than only INFOPLIST_KEY_* build settings — those cannot express an array,
    # and UIBackgroundModes MUST be an array or iOS silently ignores it, which is
    # why background audio did not work.
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: SoundChex
        # Track the build settings, not a frozen literal — an explicit info block
        # otherwise pins the version to whatever XcodeGen first wrote (was 1.0),
        # so Settings showed the wrong release. These resolve MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION at build time.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        # All four declared because Apple REQUIRES it: an iPad build that
        # names only portrait is rejected at upload, not merely warned about
        # (S-408). Declaring them is not the same as being ready for them —
        # the layouts have no landscape handling yet — so AppDelegate narrows
        # this at runtime per screen. The plist says what the app is allowed
        # to do; the delegate says what it currently does.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad gets the same four. Split into its own key so the two can
        # diverge once iPad layouts exist.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Background audio (keeps playing when the screen locks) and AirPlay.
        UIBackgroundModes: [audio]
        # Self-hosted server over Tailscale — often plain http on a private
        # address. ATS is relaxed for that; tighten later if every deploy is https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: SoundChexLaunch
        # REQUIRED once the app has a UIApplicationDelegate (S-411).
        #
        # A pure SwiftUI app sets its scene up implicitly. Adding
        # `@UIApplicationDelegateAdaptor` switches iOS to the UIKit lifecycle,
        # which expects this manifest — and with none, iOS creates no window
        # at all. The app launches, does not crash, and shows a black screen,
        # which is exactly what shipped in 0.23.4.
        #
        # `UIApplicationSupportsMultipleScenes: false` because the app is one
        # window; SwiftUI still drives the scene through the App protocol.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Declared so every TestFlight upload does not stop and ask. The app
        # uses only HTTPS/TLS through the system, which is exempt under the
        # US export rules — there is no custom or proprietary cryptography
        # here. Without this key App Store Connect holds each build with a
        # "Missing Compliance" prompt before testers can install it.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.soundchex.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
