# The Xcode project is generated from this file with `xcodegen`, so the
# .xcodeproj is a build artifact rather than something hand-edited — the same
# approach the Tauri side uses, and it keeps merge conflicts out of the pbxproj.
#
# Regenerate after changing this file or adding source folders:
#   cd SoundChexiOS && xcodegen generate
name: SoundChex
options:
  bundleIdPrefix: app.soundchex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The signing team, kept here so `xcodegen generate` does not wipe it — the
    # generated .xcodeproj is a build artifact, so signing set in Xcode's UI does
    # not survive a regenerate. Same team the Tauri iOS build uses.
    DEVELOPMENT_TEAM: "7GSWB72PH6"
    CODE_SIGN_STYLE: Automatic
    # Versioning: SemVer with a music-themed name per minor release (see
    # Plans/Versioning.md). 0.4.0 is "Interlude" — persistent search/account
    # header on every page + Spotify-style playlists.
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "8"
    # Strict concurrency is on by default at Swift 6; keep it, the app is small
    # enough to get right from the start.
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SoundChex:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    # An explicit Info.plist (generated by XcodeGen with correct types) rather
    # than only INFOPLIST_KEY_* build settings — those cannot express an array,
    # and UIBackgroundModes MUST be an array or iOS silently ignores it, which is
    # why background audio did not work.
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: SoundChex
        # Track the build settings, not a frozen literal — an explicit info block
        # otherwise pins the version to whatever XcodeGen first wrote (was 1.0),
        # so Settings showed the wrong release. These resolve MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION at build time.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Background audio (keeps playing when the screen locks) and AirPlay.
        UIBackgroundModes: [audio]
        # Self-hosted server over Tailscale — often plain http on a private
        # address. ATS is relaxed for that; tighten later if every deploy is https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: SoundChexLaunch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.soundchex.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
